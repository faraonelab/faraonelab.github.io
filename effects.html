<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  // Initialize AOS
  AOS.init({
    duration: 1000,   // Animation length in milliseconds (1 second)
    once: true,       // Whether animation should happen only once - while scrolling down
    offset: 200,      // Offset (in px) from the original trigger point
    easing: 'ease-in-out', // Default easing for AOS animations
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Target navbar links, the logo/brand, and buttons
  const navLinks = document.querySelectorAll('.navbar-nav a, .navbar-brand, .btn');

  navLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      // Check if the link is internal (same domain) and not a hash link (#)
      const isInternal = this.hostname === window.location.hostname;
      const isHash = this.getAttribute('href').startsWith('#');

      if (isInternal && !isHash) {
        e.preventDefault(); // Stop the browser from leaving immediately
        const destination = this.href;

        // Add the exit class to the body
        document.body.classList.add('page-exit');

        // Wait for the animation (400ms) then go to the new page
        setTimeout(() => {
          window.location.href = destination;
        }, 300);
      }
    });
  });
});
</script>
