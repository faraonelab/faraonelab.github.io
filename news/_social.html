<!-- _social.html -->
<div class="social-share" style="margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px;">
  <p>Share this research:</p>
  
  <!-- Twitter/X -->
  <a id="share-twitter" href="#" target="_blank" style="margin-right: 15px; text-decoration: none;">
    <i class="bi bi-twitter-x"></i> Twitter
  </a>

  <!-- LinkedIn -->
  <a id="share-linkedin" href="#" target="_blank" style="margin-right: 15px; text-decoration: none;">
    <i class="bi bi-linkedin"></i> LinkedIn
  </a>

  <!-- Facebook -->
  <a id="share-facebook" href="#" target="_blank" style="text-decoration: none;">
    <i class="bi bi-facebook"></i> Facebook
  </a>
</div>

<script>
  window.onload = function() {
    const url = encodeURIComponent(window.location.href);
    const title = encodeURIComponent(document.title);

    document.getElementById('share-twitter').href = `https://twitter.com{url}&text=${title}`;
    document.getElementById('share-linkedin').href = `https://www.linkedin.com{url}`;
    document.getElementById('share-facebook').href = `https://www.facebook.com{url}`;
  };
</script>
