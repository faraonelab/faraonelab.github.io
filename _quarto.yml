project:
  type: website
  render:
    - "*.qmd"
    - "!publications/_template/"
    - "!people/_template/"

website:
  title: "Faraone Lab"
  favicon: images/favicon.png
  site-url: "https://faraonelab.github.io"
  repo-url: "https://github.com/faraonelab/faraonelab.github.io.git"
  twitter-card:
    title: "Faraone Lab"
    description: "Faraone Research Group at Acadia University — Department of Chemistry"
    image: "images/og-logo.png"
    card-style: summary_large_image
    creator: "@faraonelab"
  open-graph:
    title: "Faraone Lab"
    description: "Faraone Research Group at Acadia University — Department of Chemistry, Wolfville, NS, Canada."
    image: "images/og-logo.png"
    site-name: "Faraone Lab"
    locale: "en_US"
  # announcement:
  #   icon: megaphone
  #   dismissable: true
  #   content: "We are hiring! Check the open positions in the Join Us section"
  #   type: success
  #   position: below-navbar
  page-footer:
    background: "#F6F5F3"
    left: |
      Faraone Lab, [Acadia University](https://www.acadiau.ca), Department of Chemistry (117 Elliott Hall)<br>
      6 University Avenue - Wolfville, Nova Scotia B4P 2R6 Canada <br>
      Acadia University is located in Mi'kma'ki, the ancestral and unceded territory of the Mi'kmaw nation.
    center: |
      © 2026 &middot; Made with {{< fa brands r-project >}} and 
      [![](https://quarto.org/quarto.png){fig-alt="Quarto" width=65px}](https://quarto.org/) by Luis Anholeto
    right:
      - icon: github
        href: https://github.com/faraonelab/faraonelab.github.io.git
  navbar:
    search: true
    title: false
    logo: images/faraone-logo.jpg
    background: "#FFF"
    logo-alt: "Faraone Research Group"
    right:
      - href: index.qmd
        text: Home
      - href: people/index.qmd
        text: People
      - href: research/index.qmd
        text: Research
      - href: ctric/index.qmd
        text: CTRIC
      - href: news/index.qmd
        text: News
      - href: contact.qmd
        text: Contact
      - text: More
        menu:
          - href: publications/index.qmd
            text: Publications
          - href: collaborators-funding/index.qmd
            text: Collaborators & Funding
          - href: gallery/index.qmd
            text: Gallery
          - href: courses/index.qmd
            text: Courses
          - href: join-us/index.qmd
            text: Join Us

  sidebar:
    - id: empty-to-suppress-sidebars-on-other-pages

format:
  html:
    theme:
      - styles/custom.scss
      - yeti
    toc: true
    link-external-newwindow: true
    date-format: "YYYY-MM-DD"
    smooth-scroll: true
    resources:
      - images
      - _ejs/publications.ejs
    fig-format: retina
    fig-dpi: 300

execute:
  freeze: auto